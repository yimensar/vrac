name: CI

on:
  push:
    branches: [main, feature/vrac-v1]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Warm the development shell
        run: nix develop -c true
      - name: Go
        run: |
          nix develop -c sh -c 'test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }'
          nix develop -c go vet ./...
          nix develop -c go test -race ./...
      - name: Web
        working-directory: web
        run: |
          nix develop -c npm ci
          nix develop -c npm run typecheck
          nix develop -c npm test
          nix develop -c npm run build
      - name: Nix package and module
        run: nix flake check -L && nix build -L .#default
